<!-- Tarjeta de noticia: los datos llegan por @Input y se pintan con interpolación {{ }} -->
<article class="card card-noticia h-100 shadow-sm">
  <img
    [src]="noticia().imagen"
    class="card-img-top"
    [alt]="'Imagen de la noticia: ' + noticia().titulo"
    (error)="imagenPorDefecto($event)"
  />
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="badge" [class]="claseCategoria()">{{ noticia().categoria }}</span>

      <!-- Estrella de favoritos: [class.activo] y el ícono cambian según el estado -->
      <button
        type="button"
        class="btn btn-sm btn-fav"
        [class.activo]="esFavorita()"
        [title]="esFavorita() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        [attr.aria-pressed]="esFavorita()"
        aria-label="Favorito"
        (click)="alternarFavorito()"
      >
        <i class="bi" [class.bi-star-fill]="esFavorita()" [class.bi-star]="!esFavorita()"></i>
      </button>
    </div>

    <h3 class="card-title h5">{{ noticia().titulo }}</h3>
    <p class="card-text text-secondary small flex-grow-1">{{ noticia().resumen }}</p>
    <p class="small text-muted mb-3">
      <i class="bi bi-calendar3 me-1"></i>{{ noticia().fecha | fechaLarga }}
    </p>

    <div class="d-flex gap-2">
      <a [routerLink]="['/noticias', noticia().id]" class="btn btn-primary btn-sm flex-grow-1">Ver más</a>
      @if (mostrarEliminar()) {
        <button
          type="button"
          class="btn btn-outline-danger btn-sm"
          title="Eliminar noticia"
          aria-label="Eliminar noticia"
          (click)="eliminar.emit(noticia())"
        >
          <i class="bi bi-trash"></i>
        </button>
      }
    </div>
  </div>
</article>
