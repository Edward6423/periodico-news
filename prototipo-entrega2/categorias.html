<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora las noticias por categoría.">
  <title>Categorías | Periódico News</title>
  <!-- Bootstrap 5 y Bootstrap Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <!-- Estilos propios -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Header: lo genera js/app.js para no repetir el menú en cada página -->
  <header id="app-header"></header>

  <main>
    <section class="encabezado-pagina">
      <div class="container">
        <h1 class="h2 fw-bold mb-1">Categorías</h1>
        <p class="mb-0 opacity-75">Elige un tema y encuentra las noticias que te interesan.</p>
      </div>
    </section>
    <section class="container py-5">
      <!-- Tarjetas de categoría generadas desde el JSON (con conteo de noticias) -->
      <div class="row g-4" id="lista-categorias">
        <div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
      </div>
    </section>
  </main>

  <!-- Footer: lo genera js/app.js -->
  <div id="app-footer"></div>

  <!-- Scripts: Bootstrap, módulo común y script propio de la página -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/categorias.js"></script>
</body>
</html>
