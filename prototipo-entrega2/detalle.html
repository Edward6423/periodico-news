<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Información completa de la noticia seleccionada.">
  <title>Detalle de la noticia | Periódico News</title>
  <!-- Bootstrap 5 y Bootstrap Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <!-- Estilos propios -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Header: lo genera js/app.js para no repetir el menú en cada página -->
  <header id="app-header"></header>

  <main class="container py-4">
    <!-- Botón volver -->
    <a href="noticias.html" class="btn btn-outline-secondary btn-sm mb-3" id="btn-volver"><i class="bi bi-chevron-left"></i> Volver</a>

    <!-- Contenido de la noticia: lo llena js/detalle.js según el parámetro ?id= -->
    <article id="detalle">
      <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
    </article>

    <!-- Otras noticias de la misma categoría -->
    <section class="mt-5 d-none" id="bloque-relacionadas">
      <h2 class="h4 fw-bold mb-3">Noticias relacionadas</h2>
      <div class="row g-4" id="relacionadas"></div>
    </section>
  </main>

  <!-- Footer: lo genera js/app.js -->
  <div id="app-footer"></div>

  <!-- Scripts: Bootstrap, módulo común y script propio de la página -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/detalle.js"></script>
</body>
</html>
