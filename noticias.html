<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listado completo de noticias con búsqueda y filtro por categoría.">
  <title>Noticias | Periódico News</title>
  <!-- Bootstrap 5 y Bootstrap Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <!-- Estilos propios -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Header: lo genera js/app.js para no repetir el menú en cada página -->
  <header id="app-header"></header>

  <main>
    <section class="encabezado-pagina">
      <div class="container">
        <h1 class="h2 fw-bold mb-1">Noticias</h1>
        <p class="mb-0 opacity-75">Todo nuestro catálogo, actualizado al día.</p>
      </div>
    </section>

    <section class="container py-4">
      <!-- ===== Barra de búsqueda y filtro por categoría ===== -->
      <form class="row g-2 mb-4" id="form-filtros" role="search" onsubmit="return false;">
        <div class="col-md-7 col-lg-8">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="buscar" placeholder="Buscar noticias..." aria-label="Buscar noticias">
          </div>
        </div>
        <div class="col-8 col-md-3 col-lg-2">
          <select class="form-select" id="filtro-categoria" aria-label="Filtrar por categoría">
            <option value="">Todas las categorías</option>
          </select>
        </div>
        <div class="col-4 col-md-2 col-lg-2 d-grid">
          <button class="btn btn-acento" type="button" data-bs-toggle="collapse" data-bs-target="#panel-crear">
            <i class="bi bi-plus-lg"></i> Nueva
          </button>
        </div>
      </form>

      <!-- ===== Mini CRUD: formulario para crear noticias ===== -->
      <div class="collapse mb-4" id="panel-crear">
        <div class="card card-body shadow-sm border-0">
          <h2 class="h5 fw-bold mb-3"><i class="bi bi-pencil-square me-1"></i>Crear nueva noticia</h2>
          <form id="form-crear" novalidate>
            <div class="row g-3">
              <div class="col-md-8">
                <label for="nt-titulo" class="form-label">Título *</label>
                <input type="text" class="form-control" id="nt-titulo" required minlength="10" maxlength="120">
                <div class="invalid-feedback">Escribe un título de al menos 10 caracteres.</div>
              </div>
              <div class="col-md-4">
                <label for="nt-categoria" class="form-label">Categoría *</label>
                <select class="form-select" id="nt-categoria" required>
                  <option value="">Selecciona...</option>
                </select>
                <div class="invalid-feedback">Selecciona una categoría.</div>
              </div>
              <div class="col-12">
                <label for="nt-resumen" class="form-label">Descripción breve *</label>
                <input type="text" class="form-control" id="nt-resumen" required minlength="20" maxlength="200">
                <div class="invalid-feedback">La descripción debe tener entre 20 y 200 caracteres.</div>
              </div>
              <div class="col-12">
                <label for="nt-contenido" class="form-label">Contenido completo *</label>
                <textarea class="form-control" id="nt-contenido" rows="4" required minlength="50"></textarea>
                <div class="invalid-feedback">El contenido debe tener al menos 50 caracteres.</div>
              </div>
              <div class="col-md-6">
                <label for="nt-autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="nt-autor" placeholder="Usuario invitado">
              </div>
              <div class="col-md-6">
                <label for="nt-imagen" class="form-label">URL de la imagen</label>
                <input type="url" class="form-control" id="nt-imagen" placeholder="https://...">
                <div class="invalid-feedback">Ingresa una URL válida o deja el campo vacío.</div>
              </div>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar noticia</button>
              <button type="button" class="btn btn-outline-secondary" id="btn-restaurar">Restaurar catálogo original</button>
            </div>
          </form>
        </div>
      </div>

      <!-- ===== Cuadrícula dinámica de tarjetas ===== -->
      <p class="text-muted small" id="resumen-resultados"></p>
      <div class="row g-4" id="listado">
        <div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
      </div>

      <!-- ===== Paginación ===== -->
      <nav class="mt-4" aria-label="Paginación de noticias">
        <ul class="pagination justify-content-center" id="paginacion"></ul>
      </nav>
    </section>
  </main>

  <!-- Footer: lo genera js/app.js -->
  <div id="app-footer"></div>

  <!-- Scripts: Bootstrap, módulo común y script propio de la página -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/noticias.js"></script>
</body>
</html>
