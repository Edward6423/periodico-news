# Despliegue automático en GitHub Pages
# Cada vez que se sube un cambio a la rama main, GitHub compila la
# aplicación Angular y publica la carpeta dist/periodico-news/browser.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Copia de index.html como 404.html (respaldo para rutas desconocidas)
      - run: cp dist/periodico-news/browser/index.html dist/periodico-news/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/periodico-news/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
